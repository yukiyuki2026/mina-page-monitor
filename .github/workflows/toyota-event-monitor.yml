name: Toyota Event Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: '15 23,9 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: repository-state-writer
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Toyota Event Monitor
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TOYOTA_EVENT_RSS_URL: ${{ secrets.TOYOTA_EVENT_RSS_URL }}
          WAKABAYASHI_EVENT_URL: ${{ secrets.WAKABAYASHI_EVENT_URL }}
        run: node toyota-event-monitor.js

      - name: Save Toyota Event Monitor state
        if: always()
        run: |
          if [ ! -f toyota-event-state.json ]; then
            echo "toyota-event-state.json がありません"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp toyota-event-state.json /tmp/toyota-event-state.json

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/toyota-event-state.json toyota-event-state.json

          git add toyota-event-state.json

          if git diff --cached --quiet; then
            echo "toyota-event-state.json に変更はありません"
          else
            git commit -m "Update Toyota Event Monitor state"
            git push origin main
          fi
