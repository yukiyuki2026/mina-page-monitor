name: Stock Test

on:
  workflow_dispatch:

  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: repository-state-writer
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run stock test
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MINA_URL: ${{ secrets.MINA_URL }}
        run: node stock-test.js

      - name: Save stock test history
        if: always()
        run: |
          if [ ! -f stock-test-history.json ]; then
            echo "履歴ファイルがありません"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp stock-test-history.json /tmp/stock-test-history.json

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/stock-test-history.json stock-test-history.json

          git add stock-test-history.json

          if git diff --cached --quiet; then
            echo "履歴に変更はありません"
          else
            git commit -m "Update test history"
            git push origin main
          fi
