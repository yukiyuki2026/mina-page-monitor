name: Fabric Monitor

permissions:
  contents: write
  issues: write

on:
  workflow_dispatch:

  schedule:
    - cron: '*/15 * * * *'

concurrency:
  group: repository-state-writer
  cancel-in-progress: false
  
jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run page monitor
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MINA_URL: ${{ secrets.MINA_URL }}
        run: node monitor.js

      - name: Save monitor state
        run: |
          if [ ! -f state.json ]; then
            echo "state.json がありません"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp state.json /tmp/state.json

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/state.json state.json

          git add state.json

          if git diff --cached --quiet; then
            echo "state.json に変更はありません"
          else
            git commit -m "Update page monitor state"
            git push origin main
          fi
