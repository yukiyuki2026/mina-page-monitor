name: Test Mina Stock Monitor

permissions:
  contents: write
  issues: write

on:
  workflow_dispatch:

jobs:
  test-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run stock monitor
        run: node monitor.js

      - name: Test product detail
        run: node detail-test.js

      - name: Upload debug files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mina-debug
          path: |
            page.png
            page.html

      - name: Test smartphone notification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "🔔 minä perhonen 通知テスト" \
            --body "在庫監視からの通知テストです。GitHubアプリに届けば成功です。"
