name: Network Test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run network test
        env:
          MINA_URL: ${{ secrets.MINA_URL }}
        run: node network-test.js

      - name: Save full network snapshot
        if: always()
        run: |
          if [ ! -f network-full-snapshot.json ]; then
            echo "完全スナップショットファイルがありません"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add network-full-snapshot.json

          if git diff --cached --quiet; then
            echo "完全スナップショットに変更はありません"
          else
            git commit -m "Update full network snapshot"
            git pull --rebase
            git push
          fi
