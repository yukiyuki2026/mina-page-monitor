name: Kids Baby Monitor

on:
  workflow_dispatch:

  schedule:
    - cron: '11,26,41,56 * * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: kids-baby-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run Kids Baby monitor
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KIDS_BABY_URL: ${{ secrets.KIDS_BABY_URL }}
        run: node kids-baby-monitor.js

      - name: Save Kids Baby monitor state
        run: |
          if [ ! -f kids-baby-state.json ]; then
            echo "kids-baby-state.json がありません"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp kids-baby-state.json /tmp/kids-baby-state.json

          git fetch origin main
          git reset --hard origin/main

          cp /tmp/kids-baby-state.json kids-baby-state.json

          git add kids-baby-state.json

          if git diff --cached --quiet; then
            echo "kids-baby-state.json に変更はありません"
          else
            git commit -m "Update Kids Baby monitor state"
            git push origin main
          fi
